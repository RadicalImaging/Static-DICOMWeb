name: Docker CI

# Builds the image of a pull request for amd64 and arm64 and runs the smoke
# test of docker-publish.yml, so a broken image shows up before a release, not
# after npm holds the version. Also tests scripts/docker-publish-tags.sh
# against a local registry. A pull request that changes the files the image is
# made of starts it: the Docker files, the lockfile, and the packages. Nothing
# is pushed.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/**
      - scripts/docker-*.sh
      - .github/workflows/docker-ci.yml
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # arm64 compiles canvas from source, the riskiest part of the build.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: static-dicomweb:ci
          no-cache: true

      - name: Smoke test the image
        run: bash scripts/docker-smoke-test.sh static-dicomweb:ci

  publish-tags:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check the Docker scripts
        run: shellcheck scripts/docker-*.sh

      - name: Test the tag script against a local registry
        run: bash scripts/docker-publish-tags.test.sh
