name: Docker CI

# Builds the amd64 image of a pull request and runs the smoke test of
# docker-publish.yml, so a broken Dockerfile shows up before a release, not
# after npm holds the version. Only a change to the files that shape the image
# starts it. Nothing is pushed.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/docker-smoke-test.sh
      - .github/workflows/docker-ci.yml
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: static-dicomweb:ci
          no-cache: true

      - name: Smoke test the image
        run: bash scripts/docker-smoke-test.sh static-dicomweb:ci
