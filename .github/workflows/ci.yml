name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Test (supply chain + unit tests)
        run: bun run test:github

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Build (supply chain + build)
        run: bun run build:github
