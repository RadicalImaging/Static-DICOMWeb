name: Publish to npm

# Publishes the workspace packages when a change lands on master, and creates
# the GitHub Release for the tag. Adapted from the Cornerstone3D publish workflow.
#
# npm trusted publishing (OIDC) authenticates the publish, so the repository
# holds no npm token. Each package names this repository and this workflow file
# as its trusted publisher on npmjs.com, so a rename of this file stops the
# publish until the name is changed there as well.
#
# The version commit and the tag go to master BEFORE npm sees the packages. git
# can reject a push, and npm cannot take a version back, so the step that can
# fail cheaply runs first. A tag that npm does not hold yet repairs itself: a
# re-run, or the run of the next merge, sees the gap and publishes that version
# (`recover` mode) from the tagged commit instead of taking a new one. The run
# of the next merge takes no version for that merge; the merge after it, or a
# manual run, does.
#
# The RELEASE_DEPLOY_KEY deploy key pushes the version commit, and a push with a
# deploy key DOES start workflows. Only the `[skip ci]` in the message of the
# version commit (publish-version.mjs) stops a release loop. The check of the
# `chore(release): publish` subject below is a fallback. Keep both.

on:
  push:
    branches:
      - master
  workflow_dispatch:

# One publish at a time. A second run computes the same next version.
concurrency:
  group: publish-to-npm
  cancel-in-progress: false

permissions:
  contents: write # push the version commit and the tag, and create the release
  id-token: write # the OIDC token that npm trusted publishing reads

jobs:
  publish:
    runs-on: ubuntu-latest
    # A manual run can name any ref, and npm trusted publishing does not limit
    # the branch. Only master publishes.
    if: github.ref == 'refs/heads/master'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3
        with:
          # version.mjs reads the commits since the last tag, `recover` mode
          # checks out a tag, and the new tag must not collide with an existing one.
          fetch-depth: 0
          submodules: true
          # The install runs dependency lifecycle scripts, and none of them
          # needs the push credential. The push step supplies it itself.
          persist-credentials: false

      # When a second change lands first, the run that holds the tip releases
      # both changes, and this one does nothing. A re-run of a run that pushed
      # its version commit continues from that commit, in `recover` mode.
      - name: Check that this run holds the tip of master
        id: tip
        run: |
          git fetch --no-tags origin master
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          elif git log -1 --pretty=%s FETCH_HEAD | grep -q '^chore(release): publish' &&
               [ "$(git rev-parse FETCH_HEAD^)" = "$(git rev-parse HEAD)" ]; then
            echo "::notice::master holds the version commit of this run, so this run continues from that commit."
            git checkout --quiet --detach FETCH_HEAD
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            echo "::notice::master moved past ${GITHUB_SHA}. The run that holds the tip releases."
          fi

      - name: Setup pnpm
        if: steps.tip.outputs.proceed == 'true'
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        if: steps.tip.outputs.proceed == 'true'
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      # This npm exchanges the OIDC token for npm credentials, so it is pinned.
      # Trusted publishing needs 11.5.1 or later. Never let it float.
      - name: Update npm
        if: steps.tip.outputs.proceed == 'true'
        run: |
          npm install --global npm@11.19.0
          npm --version

      - name: Install dependencies
        if: steps.tip.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      # `release` takes a new version. `recover` publishes the version that
      # master already carries: when the tip is a version commit (only a manual
      # run reaches one), or when npm lacks the version that master carries.
      - name: Choose the mode for this run
        id: mode
        if: steps.tip.outputs.proceed == 'true'
        run: |
          case "$(git log -1 --pretty=%s)" in
            'chore(release): publish'*)
              echo "::notice::The tip is a version commit, so this run takes no new version."
              echo 'mode=recover' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          MODE="$(node ./scripts/release/release-mode.mjs)"
          if [ "$MODE" = 'recover' ]; then
            echo "::warning::npm does not hold the version that master carries. This run publishes that version and takes no new one."
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

      # npm must get the code of the tag, not the code of a later merge.
      # The provenance attestation still names the commit of this run
      # (GITHUB_SHA), because the OIDC token carries that commit.
      - name: Check out the tagged commit
        if: steps.mode.outputs.mode == 'recover'
        run: |
          TAG="v$(node -p "require('./packages/create-dicomweb/package.json').version")"
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::error::master carries ${TAG}, but the tag does not exist. Create the tag on the version commit, then re-run."
            exit 1
          fi

          if [ "$(git rev-parse "${TAG}^{commit}")" = "$(git rev-parse HEAD)" ]; then
            exit 0
          fi

          echo "::warning::This run builds ${TAG}, not ${GITHUB_SHA}. The provenance attestation names ${GITHUB_SHA}."
          git checkout --quiet --detach "$TAG"
          git submodule update --init --recursive
          pnpm install --frozen-lockfile

      - name: Compute the next version
        if: steps.mode.outputs.mode == 'release'
        run: node ./scripts/release/version.mjs

      - name: Build
        if: steps.tip.outputs.proceed == 'true'
        run: pnpm run build

      - name: Test
        if: steps.tip.outputs.proceed == 'true'
        run: pnpm run test

      - name: Identify the committer
        if: steps.mode.outputs.mode == 'release'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Set the package versions, commit and tag
        if: steps.mode.outputs.mode == 'release'
        run: node ./scripts/release/publish-version.mjs

      - name: Read the version of this release
        id: release
        if: steps.tip.outputs.proceed == 'true'
        run: |
          VERSION="$(node -p "require('./packages/create-dicomweb/package.json').version")"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}"

      # Before npm, on purpose. git rejects this push when a change lands on
      # master during the run, and npm holds nothing at that point.
      #
      # The push uses the RELEASE_DEPLOY_KEY deploy key, not GITHUB_TOKEN: the
      # master ruleset requires a review, and only a deploy key can bypass it
      # (a repository ruleset cannot name the GitHub Actions app as a bypass actor).
      - name: Push the version commit and the tag
        if: steps.mode.outputs.mode == 'release'
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # GitHub's SSH host keys, read over authenticated HTTPS rather than trusted on first use.
          KNOWN_HOSTS="$(mktemp)"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$KNOWN_HOSTS"
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o UserKnownHostsFile=$KNOWN_HOSTS -o StrictHostKeyChecking=yes"

          # One atomic push, so master never carries a release commit that no tag names.
          if git push --atomic "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:master "$TAG"; then
            exit 0
          fi

          echo "::error::A change landed on master during this run, so git rejected the push of ${TAG}. npm holds nothing for this version. The run for the next merge releases these changes."
          exit 1

      - name: Publish to npm
        if: steps.tip.outputs.proceed == 'true'
        run: node ./scripts/release/publish-package.mjs

      - name: Create the GitHub release
        if: steps.tip.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # A `recover` run or a re-run can reach a release that exists.
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "The release $TAG exists already."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$TAG" \
            --generate-notes
