# https://bun.sh/docs/runtime/bunfig
[install]
frozenLockfile = true
exact = true
saveTextLockfile = true
# Keep the hoisted node_modules layout; bun.lock configVersion 1 otherwise defaults workspaces to isolated.
linker = "hoisted"
# Supply-chain knob: skip package versions published in the last 2 days (seconds).
minimumReleaseAge = 172800
# Cornerstone3D releases are trusted and taken as soon as they publish.
minimumReleaseAgeExcludes = [
  "@cornerstonejs/calculate-suv",
  "@cornerstonejs/codec-big-endian",
  "@cornerstonejs/codec-charls",
  "@cornerstonejs/codec-libjpeg-turbo-12bit",
  "@cornerstonejs/codec-libjpeg-turbo-8bit",
  "@cornerstonejs/codec-libjxl",
  "@cornerstonejs/codec-little-endian",
  "@cornerstonejs/codec-openjpeg",
  "@cornerstonejs/codec-openjph",
  "@cornerstonejs/core",
  "@cornerstonejs/dicom-codec",
  "@cornerstonejs/metadata",
  "@cornerstonejs/utils",
]
